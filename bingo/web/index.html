<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bingo — Stage 1 Relay Test</title>
  <style>
    body { font-family: monospace; max-width: 640px; margin: 40px auto; padding: 0 16px; background: #111; color: #eee; }
    h1 { font-size: 1.2rem; margin-bottom: 24px; }
    label { display: block; margin-bottom: 4px; font-size: 0.85rem; color: #aaa; }
    input[type="text"] { width: 100%; box-sizing: border-box; padding: 8px; background: #222; border: 1px solid #444; color: #eee; font-family: monospace; border-radius: 3px; margin-bottom: 12px; }
    button { padding: 8px 16px; background: #2563eb; color: #fff; border: none; border-radius: 3px; cursor: pointer; font-family: monospace; }
    button:disabled { background: #444; cursor: default; }
    #status { margin: 12px 0; font-size: 0.85rem; color: #aaa; }
    #log { border: 1px solid #333; background: #1a1a1a; padding: 12px; height: 260px; overflow-y: auto; border-radius: 3px; margin-bottom: 12px; font-size: 0.85rem; line-height: 1.5; }
    .log-entry { margin-bottom: 4px; }
    .log-entry .ts { color: #555; }
    #send-row { display: flex; gap: 8px; }
    #send-row input { flex: 1; margin-bottom: 0; }
  </style>
</head>
<body>
  <h1>Bingo Stage 1 — WebSocket relay smoke test</h1>

  <label for="nickname">Nickname</label>
  <input id="nickname" type="text" placeholder="e.g. Ferex" />

  <label for="room-code">Room code</label>
  <input id="room-code" type="text" placeholder="e.g. ROOM1" />

  <button id="connect-btn">Connect</button>
  <div id="status">Not connected.</div>

  <div id="log"></div>

  <div id="send-row">
    <input id="message-input" type="text" placeholder="Type a message…" disabled />
    <button id="send-btn" disabled>Send</button>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
