<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon White — Bingo Mode</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: monospace; max-width: 800px; margin: 40px auto; padding: 0 16px; background: #111; color: #eee; }
    h1 { font-size: 1.3rem; margin-bottom: 24px; }
    h2 { font-size: 1.1rem; margin-bottom: 12px; }
    h3 { font-size: 0.95rem; margin-bottom: 8px; color: #ccc; }
    label { display: block; margin-bottom: 4px; font-size: 0.85rem; color: #aaa; }
    input[type="text"], input[type="number"] { width: 100%; padding: 8px; background: #222; border: 1px solid #444; color: #eee; font-family: monospace; border-radius: 3px; margin-bottom: 12px; }
    button { padding: 8px 16px; background: #374151; color: #eee; border: 1px solid #555; border-radius: 3px; cursor: pointer; font-family: monospace; }
    button:disabled { opacity: 0.4; cursor: default; }
    ul { margin: 4px 0; padding-left: 20px; }
    li { margin-bottom: 2px; }
    #status { margin: 12px 0; font-size: 0.85rem; color: #aaa; }

    /* End-screen winning-cell rainbow border (rotating conic gradient) */
    @property --rb-angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }
    @keyframes rb-spin { to { --rb-angle: 360deg; } }
    .win-cell-wrap {
      padding: 3px;
      border-radius: 5px;
      background: conic-gradient(from var(--rb-angle),
        #ff0040, #ff8000, #ffe600, #00e676, #00b0ff, #5e35ff, #d500f9, #ff0040);
      animation: rb-spin 2.5s linear infinite;
    }
    /* Fallback: if @property unsupported, gradient stays static (still pretty). */

    /* Log section */
    #log { border: 1px solid #333; padding: 8px; border-radius: 3px; margin-top: 24px; }
    #log-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    #log-content { background: #1a1a1a; padding: 8px; height: 180px; overflow-y: auto; font-size: 0.75rem; line-height: 1.5; border-radius: 3px; }
  </style>
</head>
<body>
  <h1>Neon White — Bingo Mode</h1>

  <!-- Pre-connect: landing / host-form / join-form -->
  <div id="join">
    <div id="landing">
      <button id="btn-show-host" style="margin-right:8px;padding:12px 24px;background:#2563eb;color:#fff;border:none;font-size:1rem;">Host new game</button>
      <button id="btn-show-join" style="padding:12px 24px;background:#374151;color:#fff;border:none;font-size:1rem;">Join game</button>
    </div>

    <div id="host-form" style="display:none;">
      <label for="host-nickname">Nickname</label>
      <input id="host-nickname" type="text" />
      <div>
        <button id="host-create-btn" style="background:#2563eb;color:#fff;">Create room</button>
        <button id="host-back-btn">Back</button>
      </div>
      <div id="host-error" style="color:#f87171;margin-top:8px;font-size:0.85rem;"></div>
    </div>

    <div id="join-form" style="display:none;">
      <label for="join-nickname">Nickname</label>
      <input id="join-nickname" type="text" />
      <label for="join-room-code">Room code</label>
      <input id="join-room-code" type="text" />
      <div>
        <button id="join-go-btn" style="background:#2563eb;color:#fff;">Join</button>
        <button id="join-back-btn">Back</button>
      </div>
      <div id="join-error" style="color:#f87171;margin-top:8px;font-size:0.85rem;"></div>
    </div>

    <div id="status">Not connected.</div>
  </div>

  <!-- Lobby section -->
  <div id="lobby" style="display:none;">
    <div id="lobby-inner"></div>
  </div>

  <!-- Starting countdown section -->
  <div id="starting" style="display:none; text-align:center; padding:60px 0;">
    <div id="starting-inner"></div>
  </div>

  <!-- Board section -->
  <div id="board" style="display:none;">
    <div id="board-inner"></div>
  </div>

  <!-- End section -->
  <div id="end" style="display:none;">
    <div id="end-inner"></div>
  </div>

  <!-- Chat panel — visible once connected -->
  <div id="chat" style="display:none;border:1px solid #333;border-radius:3px;margin-top:24px;">
    <div style="display:flex;align-items:center;gap:10px;padding:6px 10px;border-bottom:1px solid #333;font-size:0.85rem;color:#aaa;">
      <span style="flex:1;">Chat</span>
      <span style="font-size:0.75rem;color:#666;" title="Plays when a team wins">Win SFX</span>
      <input id="sfx-volume" type="range" min="0" max="100" step="1" value="60" style="width:90px;accent-color:#2563eb;" />
      <span id="sfx-volume-label" style="font-size:0.75rem;color:#888;width:32px;text-align:right;">60%</span>
    </div>
    <div id="chat-messages" style="height:180px;overflow-y:auto;padding:8px 10px;font-size:0.85rem;line-height:1.45;background:#0c0c0c;"></div>
    <div style="display:flex;gap:6px;padding:6px;border-top:1px solid #333;background:#1a1a1a;">
      <input id="chat-input" type="text" placeholder="Type a message…" style="flex:1;margin-bottom:0;padding:6px 8px;background:#222;border:1px solid #444;color:#eee;font-family:monospace;border-radius:3px;" />
      <button id="chat-send" style="padding:6px 14px;">Send</button>
    </div>
  </div>

  <!-- Debug log — always visible, collapsible -->
  <div id="log">
    <div id="log-header">
      <span style="font-size:0.8rem;color:#666;">Debug log</span>
      <button id="log-toggle" style="font-size:0.75rem;padding:2px 8px;">Hide log</button>
    </div>
    <div id="log-content"></div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
